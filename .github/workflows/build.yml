name: Gerar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        id: build
        continue-on-error: true
        run: gradle assembleRelease --no-daemon --console=plain > build.log 2>&1

      - name: Guardar resumo do build na branch buildlog
        if: always()
        run: |
          mkdir -p /tmp/lg
          {
            echo "run=${{ github.run_number }} sha=${{ github.sha }} resultado=${{ steps.build.outcome }}"
            echo "----- erros -----"
            grep -E "^e: |error:|What went wrong|FAILED|Execution failed|Could not " build.log | head -80 || true
            echo "----- fim do log -----"
            tail -40 build.log
          } > /tmp/lg/erros.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan buildlog-tmp
          git rm -rf . -q
          cp /tmp/lg/erros.txt erros.txt
          git add erros.txt
          git commit -q -m "log do build ${{ github.run_number }}"
          git push -f origin HEAD:buildlog

      - name: Falhar se a compilação falhou
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk QUADRO-v${{ github.run_number }}.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: QUADRO v${{ github.run_number }}
          body: Baixe o APK abaixo pelo navegador do celular e instale por cima da versão anterior.
          files: QUADRO-v${{ github.run_number }}.apk
